org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- Opciones del build nativo (whisper.cpp) ---
# Arquitectura ARM para ggml (modo estático). Vacío = armv8-a base (NEON, compatible con todo arm64).
# Para más velocidad en móviles recientes: armv8.2-a+fp16+dotprod (SIGILL en CPUs antiguas como A53).
whisperArmArch=
# true = compila todas las variantes de CPU de ggml y elige la mejor en tiempo de ejecución
# (detección automática de fp16/dotprod/i8mm). Ver README, sección "Rendimiento".
whisperCpuVariants=false
